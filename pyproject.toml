[project]
name = "envdoctor-mcp"
version = "0.1.0"
description = "MCP server that diagnoses environment-variable configuration problems in a project (.env files, source usage, gitignore, types) without ever showing a value."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "0xmortuex" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]
keywords = ["mcp", "dotenv", "env", "environment-variables", "secrets", "configuration", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
test = ["pytest>=7", "anyio", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/0xmortuex/envdoctor-mcp"

[project.scripts]
envdoctor-mcp = "envdoctor_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envdoctor_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
